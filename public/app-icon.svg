<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="4" y="4" width="504" height="504" rx="124" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  
  <!-- 3 priority layers / tiered lines -->
  <!-- Layer 1: Today (Highlighted Checkmark) -->
  <path d="M160 256 L224 320 L352 192" stroke="url(#glow)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Layer 2: This week -->
  <rect x="140" y="380" width="232" height="20" rx="10" fill="#38bdf8" opacity="0.7"/>
  
  <!-- Layer 3: Later -->
  <rect x="180" y="424" width="152" height="16" rx="8" fill="#94a3b8" opacity="0.4"/>
</svg>
